<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ONYX · Mine from your terminal</title>
<meta name="description" content="ONYX is a coin you mine from your terminal with SHA-256 proof-of-work. Connect a wallet, get an API key, run onyx mine.">
<meta name="theme-color" content="#f3f0e7">
<meta property="og:type" content="website">
<meta property="og:title" content="ONYX · Mine from your terminal">
<meta property="og:description" content="SHA-256 proof-of-work from any CPU. One round a minute, halving every 30 days, 50M max supply.">
<meta property="og:image" content="og.png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="ONYX · Mine from your terminal">
<meta name="twitter:description" content="SHA-256 proof-of-work from any CPU. One round a minute, halving every 30 days, 50M max supply.">
<meta name="twitter:image" content="og.png">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@300;400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  /* palette: Charcoal #2A2529 + Pale Ivory #F3F0E7 */
  --bg:#f3f0e7; --ivory:#f3f0e7; --ink:#2a2529; --muted:#554e52; --faint:#a39d9b; --line:rgba(42,37,41,.14); --chip:rgba(243,240,231,.62);
  --tint:#2a2529; --ok:#2a2529;
  --pad:clamp(18px,3.4vw,48px);
  --sans:Geist,"Helvetica Neue",Arial,sans-serif; --mono:"Geist Mono",ui-monospace,Menlo,monospace;
  color-scheme:light; box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){ color-scheme:dark; } }
:root[data-theme="dark"]{ color-scheme:dark; }
*,*::before,*::after{box-sizing:inherit}
html{background:var(--bg);scroll-padding-top:calc(env(safe-area-inset-top,0px) + 80px)}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;z-index:0;pointer-events:none;background:var(--ivory)}
main{position:relative;z-index:2}

/* live network bar */
.bar{position:fixed;z-index:11;top:env(safe-area-inset-top,0px);left:0;right:0;height:30px;display:flex;align-items:center;gap:1.6rem;padding:0 var(--pad);border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--ivory) 78%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);font:400 .64rem/1 var(--mono);letter-spacing:.04em;color:var(--muted);white-space:nowrap;overflow:hidden}
.bar b{font-weight:500;color:var(--ink)}
.bar .rev{margin-left:auto;color:var(--faint)}
.nav{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 46px);left:var(--pad);right:var(--pad);display:flex;justify-content:space-between;align-items:center;gap:1rem}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);z-index:11;background:var(--bg)}
.brand{display:flex;align-items:center;gap:.6rem;color:var(--ink);text-decoration:none;font:500 .82rem/1 var(--mono);letter-spacing:.16em}
/* logo: the ring image is used as a luminance mask, so it takes the ink colour of the page instead of a black box */
.brand .logo{width:30px;height:30px;display:block;background:var(--ink);-webkit-mask:url(logo.jpg) 50% 48%/cover no-repeat;mask:url(logo.jpg) 50% 48%/cover no-repeat luminance}
.links{display:flex;gap:clamp(1rem,2.6vw,2.4rem);margin:0;padding:.7rem 1.2rem;list-style:none;border:1px solid var(--line);border-radius:999px;background:var(--chip);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.links a{color:var(--muted);text-decoration:none;font-size:.76rem}
.links a:hover,.links a[aria-current="true"]{color:var(--ink)}
.launch{display:inline-flex;align-items:center;gap:.5rem;padding:.65rem 1.1rem;border-radius:999px;background:var(--ink);color:var(--ivory);text-decoration:none;font-size:.76rem;font-weight:500}
.launch:hover{background:#1a1619}
.nav-r{display:flex;align-items:center;gap:.5rem}
.menu-btn{display:none;appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:.6rem 1rem;font:500 .72rem/1 var(--mono);letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.num{color:var(--ink)}
.lang{position:relative}
.lang-btn{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:.6rem .85rem;font:500 .72rem/1 var(--mono);letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.lang-btn::after{content:"";display:inline-block;width:5px;height:5px;margin-left:.45rem;border-right:1px solid currentColor;border-bottom:1px solid currentColor;transform:translateY(-2px) rotate(45deg)}
.lang-list{position:absolute;right:0;top:calc(100% + 8px);margin:0;padding:.35rem;list-style:none;min-width:12rem;border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--ivory) 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);box-shadow:0 12px 30px rgba(42,37,41,.12)}
.lang-list[hidden]{display:none}
.lang-list button{display:flex;align-items:center;gap:.7rem;width:100%;white-space:nowrap;appearance:none;border:0;background:none;color:var(--ink);text-align:left;padding:.6rem .7rem;border-radius:10px;font:400 .82rem var(--sans);cursor:pointer}
.lang-list button b{font:500 .64rem var(--mono);letter-spacing:.1em;color:var(--muted);width:1.6rem}
.lang-list button:hover,.lang-list button[aria-checked="true"]{background:color-mix(in srgb,var(--ink) 7%,transparent)}
.lang-list button[aria-checked="true"]::after{content:"✓";margin-left:auto;font-size:.8rem}

/* quick start in the hero */
.quick{display:grid;gap:.5rem;margin-top:1.6rem;width:min(34rem,100%)}
.qrow{display:grid;grid-template-columns:4.6rem 1fr auto;align-items:center;gap:.8rem;padding:.55rem .55rem .55rem 1rem;border:1px solid var(--line);border-radius:12px;background:color-mix(in srgb,var(--ivory) 62%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.qrow span{font:500 .62rem/1 var(--mono);letter-spacing:.14em;color:var(--muted)}
.qrow code{font:400 .76rem/1.3 var(--mono);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qrow code.soon{color:var(--faint)}
.qrow button{appearance:none;border:1px solid var(--line);background:var(--ivory);color:var(--ink);border-radius:999px;padding:.38rem .8rem;font:500 .66rem var(--mono);cursor:pointer}
.qrow button:disabled{opacity:.45;cursor:default}

/* spec sheet */
.spec{margin-top:2.2rem;width:min(34rem,100%);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--ivory) 66%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.spec header{display:flex;justify-content:space-between;padding:.85rem 1.2rem;border-bottom:1px solid var(--line);font:500 .64rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.spec dl{margin:0;display:grid;grid-template-columns:9.5rem 1fr}
.spec dt,.spec dd{margin:0;padding:.72rem 1.2rem;border-bottom:1px solid var(--line);font-size:.84rem}
.spec dt{font:400 .74rem/1.5 var(--mono);color:var(--muted)}
.spec dd{color:var(--ink);font-variant-numeric:tabular-nums}
.spec dt:nth-last-of-type(1),.spec dd:last-child{border-bottom:0}

section{position:relative;min-height:100vh;min-height:100svh;padding:calc(env(safe-area-inset-top,0px) + 140px) var(--pad) calc(env(safe-area-inset-bottom,0px) + 70px);display:flex;flex-direction:column;justify-content:center}
.label{font:500 .66rem/1 var(--mono);letter-spacing:.18em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:.7rem;margin:0 0 1.4rem}
.label::before{content:"";width:22px;height:1px;background:var(--faint)}
h1,h2{margin:0;font-weight:300;letter-spacing:-.045em}
h1{font-size:clamp(2.8rem,7vw,7rem);line-height:.92}
h2{font-size:clamp(2.1rem,4.6vw,4.4rem);line-height:.98}
.lede{margin:1.6rem 0 0;font-size:clamp(.92rem,1.2vw,1.05rem);line-height:1.6;color:var(--muted);max-width:38ch}
.btns{display:flex;gap:.7rem;flex-wrap:wrap;margin-top:2rem}
.ghost{display:inline-flex;align-items:center;padding:.7rem 1.2rem;border-radius:999px;border:1px solid var(--line);color:var(--ink);text-decoration:none;font-size:.78rem;background:var(--chip)}
.ghost:hover{border-color:var(--ink)}
.half{max-width:min(36rem,46vw)}
.right{align-items:flex-end;text-align:right}
.right .lede{margin-left:auto}
.right .label{flex-direction:row-reverse}

/* hero */
.k-hero{justify-content:flex-end}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);margin-right:.5rem;box-shadow:0 0 0 0 var(--ok);animation:ping 2.2s ease-out infinite}
@keyframes ping{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--ok) 60%,transparent)}80%,100%{box-shadow:0 0 0 8px transparent}}
.k-hero .scroll{position:absolute;right:var(--pad);bottom:calc(env(safe-area-inset-bottom,0px) + 70px);font:500 .62rem/1 var(--mono);letter-spacing:.2em;color:var(--muted);display:flex;align-items:center;gap:.7rem}
.k-hero .scroll i{width:40px;height:1px;background:var(--faint);position:relative;overflow:hidden}
.k-hero .scroll i::after{content:"";position:absolute;inset:0;background:var(--ink);transform:translateX(-100%);animation:slide 2s cubic-bezier(.6,0,.3,1) infinite}
@keyframes slide{to{transform:translateX(100%)}}

/* capabilities */
.caps{list-style:none;margin:2.4rem 0 0;padding:0;display:grid;gap:0;max-width:30rem}
.caps li{display:grid;grid-template-columns:3rem 1fr;gap:1rem;padding:1.2rem 0;border-top:1px solid var(--line)}
.caps li:last-child{border-bottom:1px solid var(--line)}
.caps b{font:500 .66rem/1.6 var(--mono);color:var(--faint)}
.caps h3{margin:0 0 .35rem;font-size:1.05rem;font-weight:500}
.caps p{margin:0;font-size:.84rem;line-height:1.55;color:var(--muted)}

/* how it works */
.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:3rem;width:100%;align-self:stretch;text-align:left;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.step{background:color-mix(in srgb,var(--ivory) 55%,transparent);padding:1.6rem 1.3rem 1.8rem;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.step b{display:block;font:500 .66rem/1 var(--mono);color:var(--muted);margin-bottom:2.6rem}
.step h3{margin:0 0 .5rem;font-size:1rem;font-weight:500}
.step p{margin:0;font-size:.8rem;line-height:1.55;color:var(--muted)}

/* terminal */
.term{margin-top:2.4rem;width:min(40rem,100%);border:1px solid var(--line);border-radius:14px;background:color-mix(in srgb,var(--ivory) 60%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);overflow:hidden}
.term header{display:flex;align-items:center;gap:.4rem;padding:.75rem 1rem;border-bottom:1px solid var(--line);font:400 .66rem/1 var(--mono);color:var(--muted)}
.term header i{width:8px;height:8px;border-radius:50%;background:var(--faint)}
.term header span{margin-left:auto}
.term pre{margin:0;padding:1.1rem 1.1rem 1.3rem;font:400 .78rem/1.75 var(--mono);color:var(--ink);min-height:15.5em;white-space:pre-wrap}
.term .c{color:var(--muted)} .term .g{color:var(--ok)} .term .t{color:var(--tint)}
.caret{display:inline-block;width:.55em;height:1em;background:var(--ink);vertical-align:-2px;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

/* access */
.k-access{align-items:center;text-align:center}
.k-access .lede{margin-left:auto;margin-right:auto}
.form{display:flex;gap:.5rem;margin-top:2rem;padding:.35rem;border:1px solid var(--line);border-radius:999px;background:var(--chip);width:min(28rem,100%)}
.form input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:400 .86rem var(--sans);padding:.6rem .9rem;outline:none}
.form input::placeholder{color:var(--faint)}
.form button{border:0;border-radius:999px;background:var(--ink);color:var(--ivory);font:500 .78rem var(--sans);padding:.65rem 1.2rem;cursor:pointer}
.form:focus-within{border-color:var(--muted)}
.note{min-height:1.2em;margin:.9rem 0 0;font:400 .7rem var(--mono);color:var(--muted)}
button.launch{border:0;cursor:pointer;font-family:var(--sans)}

/* network */
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;margin-top:2.4rem;background:var(--line);border:1px solid var(--line);border-radius:16px;overflow:hidden;align-self:stretch}
.stats>div{background:color-mix(in srgb,var(--ivory) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);padding:1.2rem 1.3rem 1.3rem;display:grid;gap:.5rem}
.stats b{font:500 .64rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.stats strong{font-size:clamp(1.4rem,2.4vw,2rem);font-weight:300;letter-spacing:-.03em;font-variant-numeric:tabular-nums}
.stats small{font:400 .68rem var(--mono);color:var(--muted)}
.tables{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin-top:1rem;align-self:stretch}
.tbl{border:1px solid var(--line);border-radius:16px;overflow:auto;background:color-mix(in srgb,var(--ivory) 70%,transparent);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.tbl h3{margin:0;padding:1rem 1.2rem .6rem;font-size:.9rem;font-weight:500}
.tbl table{width:100%;border-collapse:collapse;font:400 .74rem/1.4 var(--mono);font-variant-numeric:tabular-nums}
.tbl th{text-align:left;font-weight:500;color:var(--muted);padding:.5rem 1.2rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:.5rem 1.2rem;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}

/* charts */
.chart{margin:1rem 0 0;width:min(34rem,100%);border:1px solid var(--line);border-radius:16px;overflow:hidden;background:color-mix(in srgb,var(--ivory) 66%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chart.wide{width:auto;align-self:stretch}
.chart figcaption{display:flex;justify-content:space-between;padding:.85rem 1.2rem;border-bottom:1px solid var(--line);font:500 .64rem/1 var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.chart svg{display:block;width:100%;height:auto;padding:.8rem 1rem .6rem}
.chart.wide svg{height:96px}
.chart text{font:400 9px var(--mono);fill:var(--muted);text-anchor:middle}
.chart text.y{text-anchor:end}
.chart .g{stroke:var(--line);stroke-width:1}
.chart .cap{stroke:var(--ink);stroke-width:1;stroke-dasharray:3 4;opacity:.5}
.chart .area{fill:var(--ink);opacity:.08}
.chart .ln{fill:none;stroke:var(--ink);stroke-width:1.6}
.chart .b{fill:var(--ink)}
.chart .e{fill:var(--faint);opacity:.5}

/* faq */
.faq{margin-top:2rem;width:min(36rem,100%);border-top:1px solid var(--line)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;gap:1rem;padding:1.05rem 0;font-size:.98rem}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"+";font:400 1.1rem/1 var(--mono);color:var(--muted);transition:transform .25s}
.faq details[open] summary::after{transform:rotate(45deg)}
.faq p{margin:0 0 1.1rem;font-size:.86rem;line-height:1.6;color:var(--muted);max-width:52ch}

.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td,.tbl tr.click:focus-visible td{background:color-mix(in srgb,var(--ink) 5%,transparent)}
.tbl tr.detail td{white-space:normal;background:color-mix(in srgb,var(--ink) 4%,transparent);padding:.7rem 1.2rem 1rem}
.payouts{display:grid;grid-template-columns:1fr auto auto;gap:.25rem 1.2rem;font:400 .72rem/1.5 var(--mono)}
.payouts b{font-weight:500;color:var(--muted);grid-column:1 / -1;margin-bottom:.3rem}
.check{display:flex;align-items:center;justify-content:space-between;gap:1rem;flex-wrap:wrap;margin-top:1rem;padding:.8rem 1rem;border:1px solid var(--line);border-radius:12px;font:400 .76rem/1.4 var(--mono);color:var(--muted)}
.check.due{border-color:var(--ink);color:var(--ink)}
.check .launch{padding:.5rem .9rem;font-size:.72rem}
.disc{flex-basis:100%;margin:0 0 .6rem;font:400 .66rem/1.6 var(--mono);color:var(--muted);max-width:90ch}
.tbl tr.me td{font-weight:500;background:color-mix(in srgb,var(--ink) 6%,transparent)}
.tbl em{font-style:normal;font-size:.62rem;letter-spacing:.1em;text-transform:uppercase;padding:.1rem .4rem;border-radius:999px;background:var(--ink);color:var(--ivory);margin-left:.3rem}

/* key box */
.keybox{margin-top:2rem;width:min(40rem,100%);text-align:left;border:1px solid var(--line);border-radius:16px;padding:1.3rem;background:color-mix(in srgb,var(--ivory) 72%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.keybox[hidden]{display:none}
.keybox .label{margin-bottom:.6rem}
.addr{margin:0 0 1rem;font:400 .8rem var(--mono);word-break:break-all}
.cmd{display:grid;grid-template-columns:6.5rem 1fr auto;gap:.6rem;align-items:center;padding:.55rem 0;border-top:1px solid var(--line)}
.cmd span{font:500 .64rem var(--mono);letter-spacing:.08em;color:var(--muted);text-transform:uppercase}
.cmd code{font:400 .76rem var(--mono);word-break:break-all}
.cmd button{appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:.35rem .8rem;font:500 .68rem var(--mono);cursor:pointer}
.bal{margin:1rem 0 .4rem;font-size:.86rem}
.note a{color:var(--ink)}
.pick{display:inline-flex;flex-wrap:wrap;justify-content:center;gap:.5rem}
.pick button{display:inline-flex;align-items:center;gap:.5rem;appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:.45rem .9rem .45rem .5rem;font:500 .74rem var(--sans);cursor:pointer}
.pick button:hover{border-color:var(--ink)}
.pick img{width:20px;height:20px;border-radius:6px}
.fine{margin:0;font:400 .68rem/1.5 var(--mono);color:var(--muted)}

footer{position:relative;z-index:2;display:flex;justify-content:space-between;flex-wrap:wrap;gap:1rem;padding:1.4rem var(--pad) calc(env(safe-area-inset-bottom,0px) + 1.4rem);border-top:1px solid var(--line);font:400 .68rem var(--mono);color:var(--faint)}
footer a{color:var(--muted);text-decoration:none;margin-left:1.2rem}

/* reveal */
.rv{opacity:0;transform:translateY(24px);transition:opacity 1s ease,transform 1.1s cubic-bezier(.2,.75,.1,1);transition-delay:calc(var(--d,0) * 90ms)}
.in .rv{opacity:1;transform:none}

/* tune */
.tune-btn{position:fixed;left:var(--pad);bottom:calc(env(safe-area-inset-bottom,0px) + 18px);z-index:12;appearance:none;border:1px solid var(--line);background:var(--chip);color:var(--ink);border-radius:999px;padding:.55rem 1rem;font:500 .7rem/1 var(--mono);letter-spacing:.08em;cursor:pointer;backdrop-filter:blur(8px)}
.tune{position:fixed;left:var(--pad);bottom:calc(env(safe-area-inset-bottom,0px) + 62px);z-index:12;width:min(300px,calc(100vw - 2*var(--pad)));padding:1.1rem;border-radius:16px;background:rgba(243,240,231,.92);border:1px solid var(--line);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);font-size:.76rem}
.tune[hidden]{display:none}
.tune h2{margin:0 0 .9rem;font-size:.95rem;font-weight:500;letter-spacing:0}
.row{margin:0 0 .9rem;border:0;padding:0}
.row legend,.row .lbl{display:flex;justify-content:space-between;width:100%;margin-bottom:.45rem;color:var(--muted)}
.sw{display:flex;gap:.5rem}
.sw input{position:absolute;opacity:0;pointer-events:none}
.sw label{width:26px;height:26px;border-radius:50%;cursor:pointer;background:var(--g);box-shadow:inset 0 0 0 2px rgba(42,37,41,.18);display:block}
.sw input:checked + label{outline:2px solid var(--ink);outline-offset:2px}
.sw input:focus-visible + label{outline:2px dashed var(--ink);outline-offset:3px}
input[type=range]{width:100%;accent-color:var(--ink)}
.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{text-align:center;padding:.42rem 0;cursor:pointer;color:var(--muted)}
.seg input:checked + label{background:var(--ink);color:var(--ivory)}
.seg input:focus-visible + label{outline:1px dashed var(--ink);outline-offset:-3px}
.reset{appearance:none;background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;padding:0;font:inherit}
:focus-visible{outline:1px solid var(--ink);outline-offset:3px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

@media (max-width:820px){
  .links{display:none;position:absolute;top:calc(100% + 10px);left:0;right:0;flex-direction:column;gap:0;padding:.4rem 1.2rem;border-radius:16px;background:color-mix(in srgb,var(--ivory) 94%,transparent)}
  .links li a{display:block;padding:.85rem 0;font-size:.9rem;border-bottom:1px solid var(--line)}
  .links li:last-child a{border-bottom:0}
  .nav.open .links{display:flex}
  .menu-btn{display:inline-flex}
  .bar .hide-m{display:none}
  .k-hero .scroll{display:none}
  .qrow{grid-template-columns:1fr auto}
  .qrow span{grid-column:1 / -1}
  .spec dl{grid-template-columns:7rem 1fr}
  .half{max-width:none}
  .right{align-items:flex-start;text-align:left}
  .right .lede{margin-left:0}
  .right .label{flex-direction:row}
  section{justify-content:flex-end}
  .steps{grid-template-columns:1fr 1fr}
  .stats{grid-template-columns:1fr 1fr}
  .tables{grid-template-columns:1fr}
  .cmd{grid-template-columns:1fr auto}
  .cmd span{grid-column:1 / -1}
}
@media (max-width:480px){ .nav .launch{display:none} } /* small phones: the hero keeps the main button */
@media (prefers-reduced-motion:reduce){
  .rv{transition:opacity .3s;transform:none}
  .dot,.caret,.k-hero .scroll i::after{animation:none}
}

/* ---------- mining: live network stats ---------- */
const fmtN = (n, d = 0) => Number(n).toLocaleString("en-US", { maximumFractionDigits: d });
const fmtRate = h => h >= 1e9 ? fmtN(h/1e9, 2) + " GH/s" : h >= 1e6 ? fmtN(h/1e6, 2) + " MH/s" : h >= 1e3 ? fmtN(h/1e3, 1) + " kH/s" : fmtN(h) + " H/s";
const short = a => a.slice(0, 6) + "…" + a.slice(-4);
const ago = t => { if (!t) return "—"; const s = Math.max(0, Math.round((Date.now() - t)/1000)); return s < 60 ? t("js.secAgo", "{n}s ago", { n: s }) : s < 3600 ? t("js.minAgo", "{n}m ago", { n: Math.round(s/60) }) : t("js.hAgo", "{n}h ago", { n: Math.round(s/3600) }); };
const escH = t => String(t).replace(/[&<>"]/g, c => ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" })[c]);
let net = null, skew = 0;
// numbers glide to their new value instead of jumping (instant with reduced motion)
function countTo(el, to, fmt){
  const from = +el.dataset.v || 0; el.dataset.v = to;
  if (reduceMotion || from === to || !el.dataset.seen) { el.dataset.seen = 1; el.textContent = fmt(to); return; }
  const t0 = performance.now(), dur = 700;
  const step = now => { const k = Math.min(1, (now - t0)/dur), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(from + (to - from)*e); if (k < 1 && +el.dataset.v === to) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}
async function refreshStats(){
  try {
    const r = await fetch("/api/stats", { cache: "no-store" });
    net = await r.json(); skew = net.serverTime - Date.now();
    countTo($("n-miners"), net.activeMiners, v => fmtN(v));
    countTo($("n-rate"), net.hashrate, fmtRate);
    $("n-round").textContent = "#" + net.round;
    countTo($("n-circ"), net.circulating, v => fmtN(v));
    $("n-emit").textContent = fmtN(net.emissionPerRound, 1) + " " + t("js.perRound", "/ round") + " · " + t("js.max", "max") + " " + fmtN(net.maxSupply);
    $("hs0").textContent = t("js.online", "Network online · {n} " + (net.activeMiners === 1 ? "miner" : "miners"), { n: net.activeMiners });
    $("hs1").textContent = fmtRate(net.hashrate);
    $("hs3").textContent = fmtN(net.emissionPerRound, 1) + " " + t("js.perRound", "/ round");
    $("hs4").textContent = "#" + net.round;
    $("sp-emit").textContent = fmtN(net.emissionPerRound, 1);
    $("n-rounds").innerHTML = net.rounds.length ? net.rounds.map(r => `<tr class="click" data-round="${r.id}" tabindex="0" title="Show payouts"><td>#${r.id}</td><td>${ago(r.ended)}</td><td>${r.miners}</td><td>${r.shares}</td><td>${fmtN(r.emission, 1)}</td></tr>`).join("") : `<tr><td colspan="5">${t("js.noRounds", "No rounds mined yet")}</td></tr>`;
    $("n-board").innerHTML = net.leaderboard.length ? net.leaderboard.map((m, i) => { const me = myAddr && m.address === myAddr; return `<tr${me ? ' class="me"' : ""}><td>${i+1}</td><td title="${escH(m.address)}">${escH(short(m.address))}${me ? " <em>" + t("js.you", "you") + "</em>" : ""}</td><td>${fmtN(m.shares)}</td><td>${fmtN(m.earned, 1)}</td><td>${ago(m.lastShare)}</td></tr>`; }).join("") : `<tr><td colspan="5">${t("js.first", "Be the first miner")}</td></tr>`;
    drawHistory(net.history || [], net.round);
  } catch (e) { $("hs0").textContent = t("js.offline", "network offline"); }
}
// activity chart: one bar per round of the last hour (empty rounds stay as a faint tick)
function drawHistory(hist, round){
  const by = new Map(hist.map(h => [h.id, h])), n = 60, W = 600, H = 90, bw = W/n;
  const max = Math.max(1, ...hist.map(h => h.shares));
  let bars = "", total = 0;
  for (let i = 0; i < n; i++) {
    const r = by.get(round - n + i), v = r ? r.shares : 0; total += v;
    const h = v ? Math.max(3, (H - 6)*v/max) : 1.5;
    bars += `<rect x="${(i*bw + 1).toFixed(1)}" y="${(H - h).toFixed(1)}" width="${(bw - 2).toFixed(1)}" height="${h.toFixed(1)}" class="${v ? "b" : "e"}"><title>Round #${round - n + i}: ${v} shares${r ? ", " + r.miners + " miners" : ""}</title></rect>`;
  }
  $("n-hist").innerHTML = bars;
  $("n-hist-sum").textContent = t("js.shares", "{n} shares", { n: fmtN(total) });
}
setInterval(() => {
  if (!net) return;
  const left = Math.max(0, Math.ceil((net.roundEndsAt - (Date.now() + skew))/1000));
  $("n-left").textContent = t("js.endsIn", "ends in {s}s", { s: left }); $("hs2").textContent = t("js.roundEnds", "round ends {s}s", { s: left });
  if (left === 0) refreshStats();
}, 1000);
refreshStats(); setInterval(refreshStats, 15000);

/* ---------- mining: wallet sign-in ---------- */
let myKey = null, myAddr = null;
const MINER = "onyx-miner";
function showMiner(address, apiKey){
  myKey = apiKey; myAddr = address.toLowerCase();
  $("k-addr").textContent = myAddr; $("k-key").textContent = apiKey;
  $("k-install").textContent = INSTALL;
  $("k-login").textContent = "onyx login " + apiKey + (location.origin === "http://127.0.0.1:4000" ? "" : " --server " + location.origin);
  $("keybox").hidden = false; $("connect").textContent = t("js.signAgain", "Sign in again (new key)");
  refreshMe(); refreshStats();
}
try { const saved = JSON.parse(localStorage.getItem(MINER) || "null"); if (saved && saved.apiKey && saved.address) showMiner(saved.address, saved.apiKey); } catch (e) {}
$("signout").addEventListener("click", () => {
  try { localStorage.removeItem(MINER); } catch (e) {}
  myKey = myAddr = null; $("keybox").hidden = true; $("connect").textContent = t("launch", CONFIG.launch); $("note").textContent = t("js.signedOut", "Signed out on this browser. Your balance stays with your wallet.");
  refreshStats();
});
// wallets announce themselves (EIP-6963), so people with several extensions can pick one
const wallets = new Map();
addEventListener("eip6963:announceProvider", e => { const d = e.detail; if (d && d.info && d.provider) wallets.set(d.info.uuid, d); });
dispatchEvent(new Event("eip6963:requestProvider"));
const isPhone = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);

function connect(){
  const note = $("note");
  const list = [...wallets.values()];
  if (list.length > 1) {
    // let the visitor choose which wallet signs
    note.innerHTML = `<span class="pick">${list.map((w, i) => `<button type="button" data-w="${i}"><img src="${escH(w.info.icon)}" alt="">${escH(w.info.name)}</button>`).join("")}</span>`;
    note.querySelectorAll("[data-w]").forEach(b => b.addEventListener("click", () => signIn(list[+b.dataset.w].provider)));
    return;
  }
  const provider = list[0] ? list[0].provider : window.ethereum;
  if (provider) return signIn(provider);
  if (isPhone) {
    // phone browsers have no wallet: reopen this page inside a wallet app's browser
    const here = location.host + location.pathname;
    note.innerHTML = `${t("js.openIn", "Open this page in your wallet app:")} <a href="https://metamask.app.link/dapp/${escH(here)}">MetaMask</a> · <a href="okx://wallet/dapp/url?dappUrl=${encodeURIComponent(location.href)}">OKX Wallet</a>`;
    return;
  }
  note.textContent = t("js.noWallet", "No wallet found. Install MetaMask, OKX Wallet or Rabby, then try again.");
}

async function signIn(provider){
  const note = $("note");
  try {
    note.textContent = t("js.waiting", "Waiting for your wallet…");
    const [address] = await provider.request({ method: "eth_requestAccounts" });
    const { message } = await (await fetch("/api/auth/nonce?address=" + address)).json();
    note.textContent = t("js.signMsg", "Sign the message in your wallet. It is free and moves no funds.");
    const hex = "0x" + [...new TextEncoder().encode(message)].map(b => b.toString(16).padStart(2, "0")).join("");
    const signature = await provider.request({ method: "personal_sign", params: [hex, address] });
    const r = await fetch("/api/auth/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ address, signature }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "sign-in failed");
    try { localStorage.setItem(MINER, JSON.stringify({ address: j.address, apiKey: j.apiKey })); } catch (e) {}
    note.textContent = ""; showMiner(j.address, j.apiKey);
  } catch (e) { note.textContent = e.code === 4001 ? t("js.cancelled", "Cancelled in the wallet.") : t("js.failed", "Could not sign in: ") + e.message; }
}
async function refreshMe(){
  if (!myKey) return;
  try {
    const r = await fetch("/api/me", { headers: { Authorization: "Bearer " + myKey } });
    if (r.status === 401) { // key replaced from another browser: forget it here
      try { localStorage.removeItem(MINER); } catch (e) {}
      myKey = myAddr = null; $("keybox").hidden = true; $("connect").textContent = t("launch", CONFIG.launch); $("note").textContent = t("js.replaced", "Your key was replaced. Connect again to get a new one."); return;
    }
    const me = await r.json(); countTo($("k-earned"), me.earned, v => fmtN(v, 4)); $("k-shares").textContent = fmtN(me.shares);
    checkDueAt = me.checkDueAt || 0; renderCheck();
  } catch (e) {}
}
setInterval(refreshMe, 15000);
$("connect").addEventListener("click", connect);
/* ---------- anti-bot check: re-sign with the miner's wallet every 30 minutes ---------- */
let checkDueAt = 0;
function renderCheck(){
  if (!myKey || !checkDueAt) return;
  const left = checkDueAt - Date.now(), due = left <= 0;
  $("k-check").classList.toggle("due", due);
  $("k-confirm").hidden = !due;
  $("k-check-txt").textContent = due ? t("js.checkNow", "Mining paused: confirm you're still here") : t("js.checkIn", "Next anti-bot check in {m} min", { m: Math.max(1, Math.ceil(left/60000)) });
}
setInterval(renderCheck, 30000);
$("k-confirm").addEventListener("click", async () => {
  const note = $("note");
  const w = [...wallets.values()];
  const provider = (w[0] && w[0].provider) || window.ethereum;
  if (!provider) { note.textContent = t("js.noWallet", "No wallet found. Install MetaMask, OKX Wallet or Rabby, then try again."); return; }
  try {
    const accounts = await provider.request({ method: "eth_requestAccounts" });
    const address = accounts.find(a => a.toLowerCase() === myAddr);
    if (!address) { note.textContent = t("js.wrongWallet", "Switch to wallet {a} in your wallet app, then try again.", { a: short(myAddr) }); return; }
    const { message } = await (await fetch("/api/auth/nonce?address=" + address)).json();
    note.textContent = t("js.signMsg", "Sign the message in your wallet. It is free and moves no funds.");
    const hex = "0x" + [...new TextEncoder().encode(message)].map(b => b.toString(16).padStart(2, "0")).join("");
    const signature = await provider.request({ method: "personal_sign", params: [hex, address] });
    const r = await fetch("/api/check", { method: "POST", headers: { "Content-Type": "application/json", Authorization: "Bearer " + myKey }, body: JSON.stringify({ signature }) });
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || "check failed");
    checkDueAt = j.checkDueAt; renderCheck(); note.textContent = t("js.checkOk", "Confirmed. Mining continues.");
  } catch (e) { note.textContent = e.code === 4001 ? t("js.cancelled", "Cancelled in the wallet.") : t("js.failed", "Could not sign in: ") + e.message; }
});

async function toggleRound(tr){
  const next = tr.nextElementSibling;
  if (next && next.classList.contains("detail")) { next.remove(); return; }
  try {
    const r = await (await fetch("/api/round?id=" + tr.dataset.round)).json();
    if (!r.payouts) return;
    const rows = r.payouts.map(p => `<span title="${escH(p.address)}">${escH(short(p.address))}${myAddr && p.address === myAddr ? " · " + t("js.you", "you") : ""}</span><span>${fmtN(p.shares)} ${t("ui.sharesWord", "shares")}</span><span>${fmtN(p.paid, 2)} ONYX</span>`).join("");
    tr.insertAdjacentHTML("afterend", `<tr class="detail"><td colspan="5"><div class="payouts"><b>${t("js.payouts", "Payouts for round #{id}", { id: r.id })}</b>${rows}</div></td></tr>`);
  } catch (e) {}

  let li = 0, ci = 0, html = "";

/* ---------- three.js ---------- */
const canvas = $("gl");
const renderer = new THREE.WebGLRenderer({ canvas, antialias:false, alpha:true, powerPreference:"high-performance" });
renderer.setClearColor(0x000000, 0); // the scene renders on transparent; the post pass paints the animated backdrop behind it
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(35, 1, .1, 60);
camera.position.set(0, 0, 6.2);
const core = new THREE.Group(); scene.add(core);
const tumble = new THREE.Group(); core.add(tumble);
const U = { uVeil:{value:1}, uTime:{value:0}, uC1:{value:new THREE.Color()}, uC2:{value:new THREE.Color()}, uC3:{value:new THREE.Color()}, uEdge:{value:new THREE.Color()}, uTurb:{value:.5} };
const PAL = `uniform vec3 uC1; uniform vec3 uC2; uniform vec3 uC3;
  vec3 pal(float t){ t = fract(t); return t < .333 ? mix(uC1,uC2,t*3.) : t < .666 ? mix(uC2,uC3,(t-.333)*3.) : mix(uC3,uC1,(t-.666)*3.); }
  float hh(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
  float vn(vec3 p){ vec3 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
    return mix(mix(mix(hh(i),hh(i+vec3(1,0,0)),f.x),mix(hh(i+vec3(0,1,0)),hh(i+vec3(1,1,0)),f.x),f.y),
               mix(mix(hh(i+vec3(0,0,1)),hh(i+vec3(1,0,1)),f.x),mix(hh(i+vec3(0,1,1)),hh(i+vec3(1,1,1)),f.x),f.y),f.z); }`;

// grainy sphere: light is drawn as stipple, so the surface shimmers like film grain
// MORPH: the core is a sphere mesh whose vertices are pushed onto other shapes in the shader.
// Shapes: 0 sphere, 1 cube, 2 spindle, 3 torus, 4 star, 5 disc. Two are blended at a time.
const SHAPE_IDS = { sphere:0, cube:1, spindle:2, torus:3, star:4, disc:5 };
const M = { uShapeA:{value:0}, uShapeB:{value:0}, uMix:{value:0}, uLiquid:{value:1} };
const sphere = new THREE.Mesh(new THREE.SphereGeometry(1, 160, 120), new THREE.ShaderMaterial({
  uniforms:Object.assign(M, U),
  extensions:{ derivatives:true },
  vertexShader: PAL + `uniform float uTime; uniform float uShapeA; uniform float uShapeB; uniform float uMix; uniform float uLiquid; uniform float uTurb;
    varying vec3 vV; varying vec3 vP;
    vec3 shapeP(float id, vec3 n){
      if (id < .5) return n;
      if (id < 1.5){ vec3 a = abs(n); return n/max(a.x, max(a.y, a.z))*.78; }                 // cube
      if (id < 2.5){ float r = length(n.xz); vec2 d = r > 1e-4 ? n.xz/r : vec2(0.);             // spindle: two tall cones
        float rad = (1. - abs(n.y))*.75; return vec3(d.x*rad, n.y*1.45, d.y*rad); }
      if (id < 3.5){ float th = atan(n.z, n.x), ph = asin(clamp(n.y, -1., 1.))*2.;            // torus
        return vec3((.9 + .3*cos(ph))*cos(th), .3*sin(ph), (.9 + .3*cos(ph))*sin(th)); }
      if (id < 4.5){ vec3 a = abs(n); float m = max(a.x, max(a.y, a.z));                       // star: six long spikes
        return n*(.62 + 1.25*pow(m, 18.)); }
      return vec3(n.x*1.3, n.y*.16, n.z*1.3);                                                    // disc
    }
    void main(){
      vec3 n = normalize(position);
      float m = uMix*uMix*(3. - 2.*uMix);
      vec3 p = mix(shapeP(uShapeA, n), shapeP(uShapeB, n), m);
      // liquid surface: slow waves roll over whatever shape it is in, stronger mid-morph
      float liq = (vn(n*2.4 + vec3(uTime*.35, uTime*.21, -uTime*.27)) - .5)*.22 + (vn(n*6. - uTime*.5) - .5)*.06;
      // hard shapes stay crisp; the surface only gets really liquid while it is changing
      float soft = mix(uShapeA < .5 ? 1. : .25, uShapeB < .5 ? 1. : .25, m);
      p += n*liq*uLiquid*(soft + sin(3.14159*m)*2.2 + uTurb*.2);
      // mid-morph the form swells and splits a little, so the change reads clearly
      p *= 1. + sin(3.14159*m)*.12;
      vec4 mv = modelViewMatrix*vec4(p,1.);
      vV = -mv.xyz; vP = p;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: PAL + `uniform float uTime; uniform vec3 uEdge; varying vec3 vV; varying vec3 vP;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    float h3(vec3 p){ return fract(sin(dot(p, vec3(127.1,311.7,74.7)))*43758.5453); }
    void main(){
      vec3 V = normalize(vV);
      vec3 N = normalize(cross(dFdx(-vV), dFdy(-vV)));   // true normal of the morphed surface
      if (dot(N, V) < 0.) N = -N;
      vec3 L = normalize(vec3(-.35,.55,.75));
      float lam = max(dot(N,L), 0.), rim = pow(1. - max(dot(N,V),0.), 2.2);
      float light = .18 + .8*lam + .55*rim;
      // fixed surface speckle + shimmering screen grain
      float spec = h3(floor(vP*90.));
      float grain = h(floor(gl_FragCoord.xy/1.3) + floor(uTime*24.)*17.);
      float s = step(grain*.85 + spec*.3, light*.95);
      // colour drifts over the surface like weather on a planet
      float fl = vn(vP*2.2 + vec3(0., uTime*.12, uTime*.07))*.7 + vn(vP*5.5 - uTime*.1)*.3;
      vec3 hue = pal(fl*1.4 + uTime*.03);
      vec3 rimC = mix(pal(rim + uTime*.03), uEdge, .55);
      vec3 dotC = mix(hue, uEdge, smoothstep(.55, 1.1, lam + spec*.3)*.65);
      vec3 col = dotC*s*.95 + hue*light*.22 + rimC*rim*.45*s;
      gl_FragColor = vec4(col, 1.);
    }`
}));
tumble.add(sphere);

// torn shards: film strips wrapped around the sphere, some ending in spikes
let shardGroup = new THREE.Group(); tumble.add(shardGroup);
const shardMat = new THREE.ShaderMaterial({
  uniforms:U,
  vertexShader:`attribute float aSeed; uniform float uTime; uniform float uTurb; varying vec2 vUv; varying float vSeed; varying vec3 vN; varying vec3 vV;
    void main(){
      vUv = uv; vSeed = aSeed;
      vec3 p = position;
      float flap = sin(uTime*1.3 + uv.x*9. + aSeed*20.)*.06 + sin(uTime*.7 + uv.x*4. + aSeed*7.)*.05;
      p += normalize(position)*flap*uTurb*(.4 + uv.y);
      vec4 mv = modelViewMatrix*vec4(p,1.);
      vN = normalize(normalMatrix*normal); vV = -mv.xyz;
      gl_Position = projectionMatrix*mv;
    }`,
  fragmentShader: PAL + `uniform float uTime; uniform float uVeil; uniform vec3 uEdge; varying vec2 vUv; varying float vSeed; varying vec3 vN; varying vec3 vV;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    void main(){
      // torn edges: the strip boundary wobbles with noise
      float e = abs(vUv.y*2. - 1.);
      float tear = .78 + (n2(vec2(vUv.x*26., vSeed*40.)) - .5)*.45;
      if (e > tear) discard;
      float hole = n2(vec2(vUv.x*14., vUv.y*5. + vSeed*9.));
      if (hole > .82) discard;
      float edge = smoothstep(tear - .16, tear, e);
      float fres = pow(1. - abs(dot(normalize(vN), normalize(vV))), 2.);
      float grain = h(floor(gl_FragCoord.xy/1.3) + floor(uTime*24.)*13.);
      vec3 body = pal(vSeed + vUv.x*.6 + uTime*.04)*(.1 + .6*step(grain, .25 + fres*.6));
      // spectral fringe on the torn edge
      float k = vUv.y + uTime*.05 + vSeed;
      vec3 spec = .5 + .5*cos(6.2831*(k*2. + vec3(0., .33, .67)));
      vec3 col = mix(body, mix(uEdge, spec, .08)*1.3, edge);
      float a = mix(.55 + fres*.3, 1., edge)*uVeil;
      if (a < .02) discard;
      gl_FragColor = vec4(col, a);
    }`,
  transparent:true, depthWrite:false, side:THREE.DoubleSide
});
function rng(seed){ return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed>>>15, 1|seed); t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }; }
function buildShards(n){
  if (mobile) n = Math.min(n, 24); // fewer strips on phones keeps them cool and smooth
  tumble.remove(shardGroup); shardGroup.traverse(o => o.geometry && o.geometry.dispose());
  shardGroup = new THREE.Group(); tumble.add(shardGroup);
  const R = rng(19), SEG = 70;
  for (let k=0;k<n;k++){
    const axis = new THREE.Vector3(R()-.5, R()-.5, R()-.5).normalize();
    const ref = Math.abs(axis.y) < .9 ? new THREE.Vector3(0,1,0) : new THREE.Vector3(1,0,0);
    const a0 = new THREE.Vector3().crossVectors(axis, ref).normalize(), b0 = new THREE.Vector3().crossVectors(axis, a0);
    const outer = k % 3 === 2;                                   // every third strip floats further out as a wide veil
    const start = R()*Math.PI*2, span = outer ? 1.6 + R()*2.6 : .7 + R()*2.1, width = outer ? .12 + R()*.34 : .06 + R()*.26;
    const spike = !outer && R() < .55, rad0 = outer ? 1.32 + R()*.55 : 1.02 + R()*.1, seed = R();
    const pos = [], uv = [], idx = [], seeds = [];
    for (let i=0;i<=SEG;i++){
      const t = i/SEG, ang = start + span*t;
      const dir = a0.clone().multiplyScalar(Math.cos(ang)).addScaledVector(b0, Math.sin(ang));
      const endPull = spike ? Math.pow(Math.max(0, t*2 - 1), 3)*(.45 + seed*.35) : 0;
      const r = rad0 + Math.sin(t*Math.PI*3 + seed*9)*.04 + endPull;
      const w = width*Math.pow(Math.sin(Math.PI*Math.min(t, spike ? 1 - endPull*.0 : t)*1), .5)*(spike ? (1 - t*.85) : 1) + .004;
      const center = dir.clone().multiplyScalar(r);
      // the strip twists slightly as it wraps
      const tw = (t - .5)*(R()*.0 + .9)*(seed - .5)*2.4;
      const off = axis.clone().multiplyScalar(Math.cos(tw)).addScaledVector(dir, Math.sin(tw)*.6).normalize().multiplyScalar(w);
      pos.push(...center.clone().sub(off).toArray(), ...center.clone().add(off).toArray());
      uv.push(t, 0, t, 1); seeds.push(seed, seed);
      if (i < SEG){ const q = i*2; idx.push(q, q+1, q+2, q+1, q+3, q+2); }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute("position", new THREE.Float32BufferAttribute(pos, 3));
    g.setAttribute("uv", new THREE.Float32BufferAttribute(uv, 2));
    g.setAttribute("aSeed", new THREE.Float32BufferAttribute(seeds, 1));
    g.setIndex(idx); g.computeVertexNormals();
    const m = new THREE.Mesh(g, shardMat); m.renderOrder = 2;
    m.userData.spin = (R() - .5)*(outer ? .5 : .25);
    shardGroup.add(m);
  }
}

// orbit rings
let ringGroup = new THREE.Group(); core.add(ringGroup);
const ringMat = new THREE.LineBasicMaterial({ color:0xffffff, transparent:true, opacity:.4 });
const ringDash = new THREE.LineDashedMaterial({ color:0xffffff, transparent:true, opacity:.55, dashSize:.05, gapSize:.07 });
const satMat = new THREE.MeshBasicMaterial({ color:0xffffff });
let sats = [];
function buildRings(n){
  core.remove(ringGroup); ringGroup.traverse(o => o.geometry && o.geometry.dispose());
  ringGroup = new THREE.Group(); core.add(ringGroup); sats = [];
  const R = rng(5);
  for (let k=0;k<n;k++){
    const r = 1.55 + k*.22 + R()*.25, pts = [];
    for (let i=0;i<=200;i++){ const a = i/200*Math.PI*2; pts.push(new THREE.Vector3(Math.cos(a)*r, Math.sin(a)*r*(.94 + R()*.0), 0)); }
    const dashed = k % 3 === 1;
    const ring = new THREE.LineLoop(new THREE.BufferGeometry().setFromPoints(pts), dashed ? ringDash : ringMat);
    if (dashed) ring.computeLineDistances();
    const holder = new THREE.Group();
    if (k % 2 === 0){ // a small satellite with a short tail
      const sat = new THREE.Mesh(new THREE.SphereGeometry(.035 + R()*.03, 12, 8), satMat);
      sat.userData = { r, a: R()*Math.PI*2, sp: (.25 + R()*.4)*(R() < .5 ? -1 : 1) };
      holder.add(sat); sats.push(sat);
    }
    holder.rotation.set(Math.PI/2 + (R()-.5)*1.5, (R()-.5)*1.2, R()*Math.PI);
    holder.userData.spin = (R() < .5 ? -1 : 1)*(.05 + R()*.12);
    holder.add(ring); ringGroup.add(holder);
  }
}

/* ---------- post: chromatic split, grain, vignette ---------- */
const rt = new THREE.WebGLRenderTarget(2, 2, { minFilter:THREE.LinearFilter, magFilter:THREE.LinearFilter });
const post = new THREE.ShaderMaterial({
  uniforms:{ tDiffuse:{value:rt.texture}, uCA:{value:1}, uGrain:{value:1}, uTime:U.uTime, uRes:{value:new THREE.Vector2(1,1)} },
  vertexShader:`varying vec2 vUv; void main(){ vUv = uv; gl_Position = vec4(position.xy, 0., 1.); }`,
  fragmentShader:`uniform sampler2D tDiffuse; uniform float uCA; uniform float uGrain; uniform float uTime; uniform vec2 uRes; varying vec2 vUv;
    float h(vec2 p){ return fract(sin(dot(p, vec2(12.9898,78.233)))*43758.5453); }
    float n2(vec2 p){ vec2 i = floor(p), f = fract(p); f = f*f*(3.-2.*f);
      return mix(mix(h(i), h(i+vec2(1,0)), f.x), mix(h(i+vec2(0,1)), h(i+vec2(1,1)), f.x), f.y); }
    // BACKGROUND: soft charcoal smoke drifting over pale ivory, with film grain.
    // Two blurred blobs sit on the left (as in the reference), slowly breathing and wandering.
    vec3 backdrop(vec2 uv){
      // measured in units of the screen's short side, so blobs keep their size on phones and desktops
      float mn = min(uRes.x, uRes.y), W = uRes.x/mn, H = uRes.y/mn, t = uTime*.06;
      vec2 p = uv*vec2(W, H);
      p += (vec2(n2(p*1.3 + t), n2(p*1.3 - t + 7.)) - .5)*.22;          // slow liquid warp of the whole field
      vec3 col = mix(vec3(.90,.885,.85), vec3(.953,.941,.906), smoothstep(.0, 1., uv.x)); // pale ivory, lighter to the right
      vec2 c1 = vec2(.30*W + .06*sin(t*1.7), .70*H + .05*cos(t*1.3));
      vec2 c2 = vec2(.26*W + .07*cos(t*1.2 + 1.), .27*H + .05*sin(t*1.5 + 2.));
      float b1 = exp(-dot(p - c1, p - c1)/(.11 + .015*sin(t*2.1)));
      float b2 = exp(-dot(p - c2, p - c2)/(.14 + .02*cos(t*1.8)));
      float haze = exp(-pow(p.x - .15*W, 2.)/(.14*W*W))*.55;               // a wide cool veil down the left edge
      col = mix(col, vec3(.82,.80,.78), haze);
      col = mix(col, vec3(.58,.55,.56), b1*.42);                     // charcoal smoke
      col = mix(col, vec3(.50,.46,.48), b2*.48);
      // grain: fine, flickering a little like film
      float g = h(floor(gl_FragCoord.xy) + floor(uTime*10.)*31.) - .5;
      return col + g*.11*uGrain;
    }
    void main(){
      vec2 d = vUv - .5; float r = length(d);
      vec2 off = d*(.006 + r*.02)*uCA;
      vec4 m = texture2D(tDiffuse, vUv); float a = m.a;
      vec3 c = vec3(texture2D(tDiffuse, vUv + off).r, m.g, texture2D(tDiffuse, vUv - off).b);
      c = min(c, vec3(a));
      c += (h(vUv*uRes + fract(uTime*7.)*100.) - .5)*.07*uGrain*a;
      c *= 1. - smoothstep(.45, 1.05, r)*.65;
      gl_FragColor = vec4(max(c, 0.) + backdrop(vUv)*(1. - a), 1.);
    }`,
  depthTest:false, depthWrite:false
});
const postScene = new THREE.Scene(), postCam = new THREE.OrthographicCamera(-1,1,1,-1,0,1);
postScene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2), post));

/* ---------- layout ---------- */
let mobile = false;
function resize(){
  const w = innerWidth, h = innerHeight, dpr = Math.min(devicePixelRatio, w/h < .8 ? 1.25 : 1.75);
  renderer.setPixelRatio(dpr); renderer.setSize(w, h, false);
  rt.setSize(Math.round(w*dpr), Math.round(h*dpr));
  post.uniforms.uRes.value.set(w*dpr, h*dpr);
  camera.aspect = w/h; mobile = w/h < .8; camera.updateProjectionMatrix();
}
addEventListener("resize", resize);

/* ---------- scroll → pose ---------- */
const ptr = { x:0, y:0, sx:0, sy:0 };
addEventListener("pointermove", e => { ptr.x = e.clientX/innerWidth*2 - 1; ptr.y = e.clientY/innerHeight*2 - 1; }, { passive:true });
function poseAt(){
  const mid = innerHeight*.5;
  let best = 0;
  // fractional section index from section centers
  const centers = sections.map(s => { const r = s.getBoundingClientRect(); return r.top + r.height/2; });
  for (let i=0;i<centers.length-1;i++){
    if (centers[i] <= mid && centers[i+1] >= mid) { best = i + (mid - centers[i])/(centers[i+1] - centers[i]); break; }
    if (centers[i+1] < mid) best = i + 1;
  }
  return best;
}
let p = 0, last = performance.now(), time = 0, vel = 0, prevP = 0;
function loop(now){
  const dt = Math.min(.05, (now - last)/1000); last = now;
  const speed = reduceMotion ? 0 : settings.speed;
  time += dt*Math.max(speed, .0001); U.uTime.value = time;
  const target = poseAt();
  p += (target - p)*Math.min(1, dt*(reduceMotion ? 30 : 3.2));
  vel = lerp(vel, Math.abs(p - prevP)/Math.max(dt,.001), Math.min(1, dt*5)); prevP = p;
  const i0 = Math.min(Math.floor(p), CONFIG.sections.length-2), f = smooth(clamp01(p - i0));
  const A = CONFIG.sections[i0].pose, B = CONFIG.sections[i0+1].pose;
  const vh = 2*camera.position.z*Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), vw = vh*camera.aspect;
  let x = lerp(A.pos[0], B.pos[0], f), y = lerp(A.pos[1], B.pos[1], f), sc = lerp(A.scale, B.scale, f);
  if (mobile) { x = 0; y = vh*.27; sc *= .6; } // phones: keep the core above the headline
  else x = x*Math.min(1, vw/7);
  core.position.set(x, y, 0);
  core.scale.setScalar(sc*CONFIG.coreSize*(1 + Math.sin(Math.PI*f)*.06));
  U.uTurb.value = lerp(A.turb, B.turb, f) + Math.min(1.5, vel*1.2)*(reduceMotion ? 0 : 1);
  if (settings.morph === "auto" && !reduceMotion){
    // cycle through every shape: hold 2.6 s, morph 1.8 s
    const order = Object.keys(SHAPE_IDS), cyc = 4.4, k = Math.floor(time/cyc), fr = (time % cyc)/cyc;
    M.uShapeA.value = SHAPE_IDS[order[k % order.length]]; M.uShapeB.value = SHAPE_IDS[order[(k+1) % order.length]];
    M.uMix.value = clamp01((fr - .59)/.41);
  } else {
    M.uShapeA.value = SHAPE_IDS[A.shape || "sphere"]; M.uShapeB.value = SHAPE_IDS[B.shape || "sphere"]; M.uMix.value = f;
  }
  M.uLiquid.value = reduceMotion ? 0 : settings.liquid;
  U.uVeil.value = settings.morph === "auto" ? .45 : lerp(A.veil ?? 1, B.veil ?? 1, f);
  // slow tumble, rings drift on their own axes
  tumble.rotation.x += dt*.11*speed; tumble.rotation.y += dt*.17*speed;
  shardGroup.children.forEach(m => m.rotation.y += dt*m.userData.spin*speed);
  ringGroup.children.forEach(r => r.rotation.z += dt*r.userData.spin*speed);
  sats.forEach(s => { s.userData.a += dt*s.userData.sp*speed; s.position.set(Math.cos(s.userData.a)*s.userData.r, Math.sin(s.userData.a)*s.userData.r*.94, 0); });

  ptr.sx = lerp(ptr.sx, reduceMotion ? 0 : ptr.x, Math.min(1, dt*2)); ptr.sy = lerp(ptr.sy, reduceMotion ? 0 : ptr.y, Math.min(1, dt*2));
  core.rotation.set(ptr.sy*.25 + p*.35, ptr.sx*.35 + p*.6, 0);
  renderer.setRenderTarget(rt); renderer.render(scene, camera);
  renderer.setRenderTarget(null); renderer.render(postScene, postCam);
  requestAnimationFrame(loop);
}

/* ---------- tune ---------- */
$("swatches").innerHTML = Object.entries(CONFIG.tints).map(([k,t]) =>
  `<input type="radio" name="tint" id="tint-${k}" value="${k}"><label for="tint-${k}" style="--g:conic-gradient(${t.c1},${t.c2},${t.c3},${t.c1})" title="${t.label}"><span class="sr-only">${t.label}</span></label>`).join("");
function apply(rebuild){
  const t = CONFIG.tints[settings.tint];
  U.uC1.value.set(t.c1); U.uC2.value.set(t.c2); U.uC3.value.set(t.c3); U.uEdge.value.set(t.edge);
  ringMat.color.set(t.ring); ringDash.color.set(t.ring); satMat.color.set(t.ring); // dark lines read cleanly on the ivory backdrop

  document.documentElement.style.setProperty("--tint", t.c3);
  document.documentElement.style.setProperty("--ok", t.c3);
  post.uniforms.uCA.value = settings.chroma; post.uniforms.uGrain.value = settings.grain;
  if (rebuild !== false) { buildShards(settings.shards); buildRings(settings.rings); }
  $("tint-"+settings.tint).checked = true;
  ["shards","chroma","grain","rings","speed","liquid"].forEach(k => $(k).value = settings[k]);
  $("mo-"+settings.morph).checked = true; $("liquidOut").textContent = (+settings.liquid).toFixed(1)+"×";
  $("shardsOut").textContent = settings.shards; $("ringsOut").textContent = settings.rings;
  $("chromaOut").textContent = (+settings.chroma).toFixed(1)+"×"; $("grainOut").textContent = (+settings.grain).toFixed(1)+"×"; $("speedOut").textContent = (+settings.speed).toFixed(1)+"×";
}
$("tuneBtn").onclick = () => { const t = $("tune"), open = t.hidden; t.hidden = !open; $("tuneBtn").setAttribute("aria-expanded", open); if (open) t.querySelector("input:checked").focus(); };
addEventListener("keydown", e => { if (e.key === "Escape" && !$("tune").hidden) { $("tune").hidden = true; $("tuneBtn").setAttribute("aria-expanded", false); $("tuneBtn").focus(); } });
$("tune").addEventListener("input", e => {
  const t = e.target;
  if (t.name === "tint") settings.tint = t.value;
  if (["shards","rings"].includes(t.id)) settings[t.id] = +t.value;
  if (["chroma","grain","speed","liquid"].includes(t.id)) settings[t.id] = +t.value;
  if (t.name === "morph") settings.morph = t.value;
  apply(["shards","rings"].includes(t.id)); save();
});
$("reset").onclick = () => { settings = Object.assign({}, CONFIG.defaults); apply(); save(); };

resize(); apply();
requestAnimationFrame(loop);
</script>
</body>
</html>
